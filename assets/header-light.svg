<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f8fa"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d2a8ff"/><stop offset="0.5" stop-color="#ff7eb6"/><stop offset="1" stop-color="#ffa657"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#d0d7de"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff7eb6" stop-opacity="0.28"/><stop offset="1" stop-color="#ff7eb6" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1280" height="640" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="640" rx="18" fill="url(#dots)"/>
  <ellipse cx="930" cy="330" rx="420" ry="300" fill="url(#glow)"/>

  <text x="80" y="255" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="116" font-weight="800" letter-spacing="-4">
    <tspan fill="#1f2328">gh</tspan><tspan fill="url(#word)" dx="26">yap</tspan>
  </text>
  <text x="84" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#1f2328">A social network for your terminal.</text>
  <text x="84" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" fill="#424a53">Posts are issues. Likes are reactions.</text>
  <text x="84" y="402" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" fill="#424a53">GitHub is the backend.</text>
  <rect x="80" y="470" width="114" height="38" rx="19" fill="#f6f8fa" stroke="#d0d7de"/><text x="137" y="495" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" fill="#424a53">0 servers</text><rect x="205.8" y="470" width="134" height="38" rx="19" fill="#f6f8fa" stroke="#d0d7de"/><text x="273" y="495" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" fill="#424a53">0 databases</text><rect x="352.0" y="470" width="124" height="38" rx="19" fill="#f6f8fa" stroke="#d0d7de"/><text x="414" y="495" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" fill="#424a53">$0 / month</text><rect x="488.0" y="470" width="93" height="38" rx="19" fill="#f6f8fa" stroke="#d0d7de"/><text x="535" y="495" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" fill="#424a53">just gh</text>

  <g filter="url(#shadow)">
    <rect x="680" y="150" width="540" height="390" rx="14" fill="#0d1117" stroke="#d0d7de"/>
  </g>
  <path d="M680 164 a14 14 0 0 1 14 -14 h512 a14 14 0 0 1 14 14 v26 h-540 z" fill="#161b22"/>
  <circle cx="706" cy="171" r="7" fill="#ff5f57"/><circle cx="730" cy="171" r="7" fill="#febc2e"/><circle cx="754" cy="171" r="7" fill="#28c840"/>
  <text x="950" y="177" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#7d8590">~ zsh</text>
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18">
    <text x="712" y="236" xml:space="preserve"><tspan fill="#d2a8ff" font-weight="700">$ </tspan><tspan fill="#e6edf3" font-weight="700">gh yap</tspan></text>
    <text x="712" y="274" xml:space="preserve"><tspan fill="#6e7681">#41 </tspan><tspan fill="#e3b341" font-weight="700">@octocat</tspan><tspan fill="#7d8590"> · 3h</tspan></text>
    <text x="712" y="301" xml:space="preserve"><tspan fill="#e6edf3">    anyone else's CI green on the first try?</tspan></text>
    <text x="712" y="328" xml:space="preserve"><tspan fill="#7d8590">    ♥ 4  💬 2</tspan></text>
    <text x="712" y="366" xml:space="preserve"><tspan fill="#6e7681">#42 </tspan><tspan fill="#e3b341" font-weight="700">@you</tspan><tspan fill="#7d8590"> · now</tspan></text>
    <text x="712" y="393" xml:space="preserve"><tspan fill="#e6edf3">    shipping on a friday </tspan><tspan fill="#79c0ff">#yolo</tspan><tspan fill="#e6edf3"> cc </tspan><tspan fill="#d2a8ff">@octocat</tspan></text>
    <text x="712" y="420" xml:space="preserve"><tspan fill="#7d8590">    </tspan><tspan fill="#ff7b72">♥ 12</tspan><tspan fill="#7d8590">  💬 3</tspan></text>
    <text x="712" y="458" xml:space="preserve"><tspan fill="#d2a8ff" font-weight="700">$ </tspan><tspan fill="#e6edf3">gh yap post "hello world"</tspan></text>
    <text x="712" y="485" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">✓ </tspan><tspan fill="#e6edf3">yapped </tspan><tspan fill="#7d8590">#43</tspan></text>
  </g>
  <text x="712" y="523" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="700" fill="#d2a8ff">$</text>
  <rect x="734" y="506" width="11" height="22" fill="#e6edf3" opacity="0.85"/>
</svg>
